  # ============================================
  # K6 LOAD TESTER
  # ============================================
  k6:
    image: grafana/k6:latest
    container_name: benchmark-k6
    volumes:
      - ./k6:/scripts
      - ./results:/results
    networks:
      - benchmark-network
    profiles:
      - k6

networks:
  benchmark-network:
    driver: bridge
