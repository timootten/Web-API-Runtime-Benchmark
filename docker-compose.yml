    container_name: hono-deno
    environment:
      - PORT=3000
    ports:
      - "3022:3000"
    networks:
      - benchmark-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    profiles:
      - hono-deno

  # ============================================
  # ELYSIA SERVICES
  # ============================================
  elysia-node:
    build:
      context: ./apis/elysia-node
      dockerfile: Dockerfile
    container_name: elysia-node
    environment:
      - PORT=3000
    ports:
      - "3030:3000"
    networks:
