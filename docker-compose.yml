services:
  # ============================================
  # EXPRESS SERVICES
  # ============================================
  express-node:
    build:
      context: ./apis/express-node
      dockerfile: Dockerfile
    container_name: express-node
    environment:
      - PORT=3000
    ports:
      - "3010:3000"
    networks:
      - benchmark-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    profiles:
      - express-node

  express-bun:
    build:
      context: ./apis/express-bun
      dockerfile: Dockerfile
    container_name: express-bun
    environment:
      - PORT=3000
    ports:
      - "3011:3000"
    networks:
      - benchmark-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    profiles:
      - express-bun

  express-deno:
    build:
      context: ./apis/express-deno
      dockerfile: Dockerfile
    container_name: express-deno
    environment:
      - PORT=3000
    ports:
      - "3012:3000"
    networks:
      - benchmark-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    profiles:
      - express-deno

  # ============================================
  # HONO SERVICES
  # ============================================
