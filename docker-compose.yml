    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    profiles:
      - elysia-node

  elysia-bun:
    build:
      context: ./apis/elysia-bun
      dockerfile: Dockerfile
    container_name: elysia-bun
    environment:
      - PORT=3000
    ports:
      - "3031:3000"
    networks:
