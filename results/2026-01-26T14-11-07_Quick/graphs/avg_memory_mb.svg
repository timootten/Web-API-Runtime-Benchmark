  <text x="123.88888888888889" y="400" text-anchor="end" class="tick-label" transform="rotate(-45, 123.88888888888889, 400)">Express (Node.js)</text>

  <!-- express-bun -->
  <rect x="180.94444444444443" y="191.6959040065451" width="61.444444444444436" height="188.3040959934549" fill="#5fa2ce" stroke="#333" stroke-width="1"/>
