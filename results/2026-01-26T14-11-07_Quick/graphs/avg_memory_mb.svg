  <rect x="795.3888888888888" y="221.7837218207789" width="61.444444444444436" height="158.2162781792211" fill="#ffbb78" stroke="#333" stroke-width="1"/>
  <text x="826.111111111111" y="216.7837218207789" text-anchor="middle" class="bar-label">88.3</text>
