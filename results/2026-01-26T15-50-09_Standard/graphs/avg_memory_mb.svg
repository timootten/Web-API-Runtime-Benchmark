  <rect x="356.5" y="288.3205408605451" width="61.444444444444436" height="91.67945913945486" fill="#2ca02c" stroke="#333" stroke-width="1"/>
  <text x="387.22222222222223" y="283.3205408605451" text-anchor="middle" class="bar-label">103.7</text>
  <text x="387.22222222222223" y="400" text-anchor="end" class="tick-label" transform="rotate(-45, 387.22222222222223, 400)">Hono (Node.js)</text>

