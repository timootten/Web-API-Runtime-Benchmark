  <rect x="532.0555555555555" y="193.5333092085867" width="61.444444444444436" height="186.4666907914133" fill="#98df8a" stroke="#333" stroke-width="1"/>
  <text x="562.7777777777777" y="188.5333092085867" text-anchor="middle" class="bar-label">210.9</text>
  <text x="562.7777777777777" y="400" text-anchor="end" class="tick-label" transform="rotate(-45, 562.7777777777777, 400)">Hono (Deno)</text>

  <!-- elysia-node -->
  <rect x="619.8333333333333" y="285.3822365285542" width="61.444444444444436" height="94.61776347144581" fill="#d62728" stroke="#333" stroke-width="1"/>
  <text x="650.5555555555554" y="280.3822365285542" text-anchor="middle" class="bar-label">107.0</text>
  <text x="650.5555555555554" y="400" text-anchor="end" class="tick-label" transform="rotate(-45, 650.5555555555554, 400)">Elysia (Node.js)</text>

  <!-- elysia-bun -->
  <rect x="707.611111111111" y="320.51659347306645" width="61.444444444444436" height="59.483406526933564" fill="#ff7f0e" stroke="#333" stroke-width="1"/>
  <text x="738.3333333333331" y="315.51659347306645" text-anchor="middle" class="bar-label">67.3</text>
  <text x="738.3333333333331" y="400" text-anchor="end" class="tick-label" transform="rotate(-45, 738.3333333333331, 400)">Elysia (Bun)</text>

  <!-- elysia-deno -->
  <rect x="795.3888888888888" y="191.5352271371737" width="61.444444444444436" height="188.4647728628263" fill="#ffbb78" stroke="#333" stroke-width="1"/>
  <text x="826.111111111111" y="186.5352271371737" text-anchor="middle" class="bar-label">213.2</text>
  <text x="826.111111111111" y="400" text-anchor="end" class="tick-label" transform="rotate(-45, 826.111111111111, 400)">Elysia (Deno)</text>

  <text x="450" y="485" text-anchor="middle" class="axis-label">Framework (Runtime)</text>
  
  <!-- Axes -->
  <line x1="80" y1="60" x2="80" y2="380" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="380" x2="870" y2="380" stroke="#333" stroke-width="2"/>
  
  <!-- Best performer indicator -->
  <text x="880" y="35" text-anchor="end" class="tick-label" fill="#FFD700">★ = Best</text>
