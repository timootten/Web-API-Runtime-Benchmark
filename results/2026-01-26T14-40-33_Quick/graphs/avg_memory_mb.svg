  <text x="299.44444444444446" y="400" text-anchor="end" class="tick-label" transform="rotate(-45, 299.44444444444446, 400)">Express (Deno)</text>

  <!-- hono-node -->
  <rect x="356.5" y="239.8911296910987" width="61.444444444444436" height="140.1088703089013" fill="#2ca02c" stroke="#333" stroke-width="1"/>
