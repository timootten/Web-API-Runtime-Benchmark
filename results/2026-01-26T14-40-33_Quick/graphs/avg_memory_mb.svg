  <rect x="532.0555555555555" y="216.358057107992" width="61.444444444444436" height="163.641942892008" fill="#98df8a" stroke="#333" stroke-width="1"/>
  <text x="562.7777777777777" y="211.358057107992" text-anchor="middle" class="bar-label">84.7</text>
  <text x="562.7777777777777" y="400" text-anchor="end" class="tick-label" transform="rotate(-45, 562.7777777777777, 400)">Hono (Deno)</text>

  <!-- elysia-node -->
  <rect x="619.8333333333333" y="237.82872449676293" width="61.444444444444436" height="142.17127550323707" fill="#d62728" stroke="#333" stroke-width="1"/>
  <text x="650.5555555555554" y="232.82872449676293" text-anchor="middle" class="bar-label">73.6</text>
  <text x="650.5555555555554" y="400" text-anchor="end" class="tick-label" transform="rotate(-45, 650.5555555555554, 400)">Elysia (Node.js)</text>

  <!-- elysia-bun -->
  <rect x="707.611111111111" y="299.2354109987949" width="61.444444444444436" height="80.76458900120511" fill="#ff7f0e" stroke="#333" stroke-width="1"/>
  <text x="738.3333333333331" y="294.2354109987949" text-anchor="middle" class="bar-label">41.8</text>
  <text x="738.3333333333331" y="400" text-anchor="end" class="tick-label" transform="rotate(-45, 738.3333333333331, 400)">Elysia (Bun)</text>

  <!-- elysia-deno -->
  <rect x="795.3888888888888" y="207.9563812817762" width="61.444444444444436" height="172.0436187182238" fill="#ffbb78" stroke="#333" stroke-width="1"/>
  <text x="826.111111111111" y="202.9563812817762" text-anchor="middle" class="bar-label">89.0</text>
  <text x="826.111111111111" y="400" text-anchor="end" class="tick-label" transform="rotate(-45, 826.111111111111, 400)">Elysia (Deno)</text>

  <text x="450" y="485" text-anchor="middle" class="axis-label">Framework (Runtime)</text>
  
  <!-- Axes -->
  <line x1="80" y1="60" x2="80" y2="380" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="380" x2="870" y2="380" stroke="#333" stroke-width="2"/>
  
  <!-- Best performer indicator -->
  <text x="880" y="35" text-anchor="end" class="tick-label" fill="#FFD700">★ = Best</text>
