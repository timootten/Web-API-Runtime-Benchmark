<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <style>
    .title { font: bold 18px Arial, sans-serif; }
    .axis-label { font: bold 14px Arial, sans-serif; }
    .tick-label { font: 11px Arial, sans-serif; }
    .bar-label { font: bold 10px Arial, sans-serif; }
    .grid { stroke: #e0e0e0; stroke-width: 1; }
  </style>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="white"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" class="title">Average Memory Usage During Benchmark</text>
  
  <!-- Y-axis label -->
  <text x="25" y="220" text-anchor="middle" class="axis-label" transform="rotate(-90, 25, 220)">Memory (MB)</text>
  
  <!-- Grid lines and Y-axis ticks -->
  <line x1="80" y1="380" x2="870" y2="380" class="grid"/>
  <text x="70" y="384" text-anchor="end" class="tick-label">0.0</text>
  <line x1="80" y1="316" x2="870" y2="316" class="grid"/>
  <text x="70" y="320" text-anchor="end" class="tick-label">33.1</text>
  <line x1="80" y1="252" x2="870" y2="252" class="grid"/>
  <text x="70" y="256" text-anchor="end" class="tick-label">66.2</text>
  <line x1="80" y1="188" x2="870" y2="188" class="grid"/>
  <text x="70" y="192" text-anchor="end" class="tick-label">99.4</text>
  <line x1="80" y1="124" x2="870" y2="124" class="grid"/>
  <text x="70" y="128" text-anchor="end" class="tick-label">132.5</text>
  <line x1="80" y1="60" x2="870" y2="60" class="grid"/>
  <text x="70" y="64" text-anchor="end" class="tick-label">165.6</text>

  <!-- express-node -->
  <rect x="93.16666666666667" y="246.10835613901517" width="61.444444444444436" height="133.89164386098483" fill="#1f77b4" stroke="#333" stroke-width="1"/>
  <text x="123.88888888888889" y="241.10835613901517" text-anchor="middle" class="bar-label">69.3</text>
  <text x="123.88888888888889" y="400" text-anchor="end" class="tick-label" transform="rotate(-45, 123.88888888888889, 400)">Express (Node.js)</text>

  <!-- express-bun -->
  <rect x="180.94444444444443" y="177.21178732430533" width="61.444444444444436" height="202.78821267569467" fill="#5fa2ce" stroke="#333" stroke-width="1"/>
  <text x="211.66666666666666" y="172.21178732430533" text-anchor="middle" class="bar-label">104.9</text>
  <text x="211.66666666666666" y="400" text-anchor="end" class="tick-label" transform="rotate(-45, 211.66666666666666, 400)">Express (Bun)</text>

  <!-- express-deno -->
  <rect x="268.72222222222223" y="101.73913043478262" width="61.444444444444436" height="278.2608695652174" fill="#9ecae1" stroke="#333" stroke-width="1"/>
