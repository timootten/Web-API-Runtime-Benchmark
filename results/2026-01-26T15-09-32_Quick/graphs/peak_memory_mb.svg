  <text x="123.88888888888889" y="283.02949402491737" text-anchor="middle" class="bar-label">90.4</text>
  <text x="123.88888888888889" y="400" text-anchor="end" class="tick-label" transform="rotate(-45, 123.88888888888889, 400)">Express (Node.js)</text>

  <!-- express-bun -->
  <rect x="180.94444444444443" y="231.81795067378593" width="61.444444444444436" height="148.18204932621407" fill="#5fa2ce" stroke="#333" stroke-width="1"/>
